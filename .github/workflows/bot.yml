name: BIST30 sinyal botu
on:
  schedule:
    - cron: "40 15 * * 1-5"   # Hafta içi 18:40 (TR) - seans kapanışından sonra
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "bist30-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json backtest.json history.json stocks/
          git diff --staged --quiet || git commit -m "Sinyaller güncellendi: $(date +'%Y-%m-%d')"
          git push

          
