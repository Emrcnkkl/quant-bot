name: Günlük RSI MACD SuperTrend sinyalleri
on:
  schedule:
    # 21:30 Türkiye saati (UTC 18:30), hafta içi; kapanış sonrası.
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
concurrency:
  group: daily-signals
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Paketleri yükle
        run: python -m pip install -r requirements.txt
      - name: Hisseleri tara
        run: python quant_bot.py
      - name: Sinyal dosyasını kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          if git diff --cached --quiet; then
            echo "Sinyal dosyasında değişiklik yok."
          else
            git commit -m "Günlük sinyalleri güncelle"
            git push
          fi
